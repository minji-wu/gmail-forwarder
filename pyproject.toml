[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-forwarder"
version = "0.1.0"
description = "Search Gmail messages and forward matching messages to another inbox."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
gmail-forwarder = "gmail_forwarder.cli:main"

[tool.setuptools]
packages = ["gmail_forwarder"]
